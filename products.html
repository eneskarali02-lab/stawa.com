<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>STAWA — Ürünler</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    :root{
      --bg-top:#050507; --bg-bottom:#f7f8fc;
      --accent:#f5f5f5; --muted:#8e92a3;
      --gold:#f0b868; --ink:#111317;
      --radius:24px;
      --shadow:0 26px 70px rgba(15,16,35,0.20);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:linear-gradient(to bottom,var(--bg-top) 0,var(--bg-top) 240px,#151622 320px,var(--bg-bottom) 100%);
      color:var(--accent);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background-image:
        repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 4px),
        url("damask-transparent.png");
      background-size:4px 4px, 4px 4px, 203px 256px;
      background-repeat:repeat;
      mix-blend-mode:soft-light;
      opacity:0.55;
      z-index:-2;
    }

    header{
      position:sticky; top:0; z-index:20;
      backdrop-filter:blur(18px);
      background:linear-gradient(to bottom, rgba(5,5,10,0.96), rgba(5,5,10,0.75));
      border-bottom:1px solid rgba(255,255,255,0.10);
    }
    .header-inner{
      max-width:1180px; margin:0 auto;
      padding:12px 22px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{display:flex; align-items:center; gap:10px}
    .brand-logo{width:160px; filter:drop-shadow(0 10px 26px rgba(0,0,0,0.75))}
    .brand-logo img{width:100%; height:auto; display:block}

    nav{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    nav a{
      text-decoration:none;
      color:rgba(245,245,245,0.86);
      font-size:14px; font-weight:500;
      padding:7px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(10,11,20,0.72);
      transition:0.18s ease-out;
    }
    nav a:hover{border-color:rgba(255,255,255,0.45); background:rgba(20,22,40,0.95)}
    nav a.active{border-color:rgba(240,184,104,0.85); background:rgba(240,184,104,0.14); box-shadow:0 14px 40px rgba(0,0,0,0.60)}

    .container{max-width:1180px; margin:0 auto; padding:28px 22px 50px;}
    .kicker{
      display:inline-flex; gap:10px; align-items:center;
      font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
      color:var(--muted);
    }
    .kdot{width:7px; height:7px; border-radius:999px; background:var(--gold); box-shadow:0 0 0 5px rgba(240,183,104,0.28)}
    h1{margin:10px 0 0; font-size:clamp(26px,4vw,36px); line-height:1.15}
    .lead{margin:10px 0 0; color:rgba(142,146,163,0.95); line-height:1.8; max-width:760px}

    .card{
      margin-top:18px;
      border-radius:var(--radius);
      background:radial-gradient(circle at top left, #ffffff 0%, #f7f8fc 55%, #f1f2fb 100%);
      color:var(--ink);
      box-shadow:var(--shadow);
      border:1px solid rgba(15,16,35,0.06);
      overflow:hidden;
    }
    .card-head{
      padding:18px 18px 10px;
      display:flex; justify-content:space-between; gap:10px; align-items:baseline;
    }
    .card-head h2{margin:0; font-size:14px; letter-spacing:0.16em; text-transform:uppercase}
    .card-head span{color:#6a6d7b; font-size:13px}
    .products{
      padding:12px 14px 16px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    .pitem{
      border-radius:18px;
      background:linear-gradient(145deg,#ffffff 0%,#f7f8fc 55%,#eef0fa 100%);
      border:1px solid rgba(15,16,35,0.08);
      box-shadow:0 10px 26px rgba(15,16,35,0.10);
      padding:12px 12px 10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .ptitle{margin:0; font-weight:700}
    .pmeta{color:#6a6d7b; font-size:13px; line-height:1.5}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,0.10);
      font-size:12px;
      user-select:none;
      width:max-content;
      margin-top:2px;
    }
    .pill.in{background:rgba(50,217,81,0.10); border-color:rgba(50,217,81,0.35)}
    .pill.out{background:rgba(220,60,60,0.10); border-color:rgba(220,60,60,0.35)}
    .pill b{letter-spacing:0.10em; text-transform:uppercase}
    .empty{padding:16px; color:#6a6d7b}

    footer{ text-align:center; color:#6a6d7b; font-size:13px; padding:16px 0 30px; }

    @media (max-width: 980px){ .products{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    @media (max-width: 640px){ .products{grid-template-columns: 1fr;} .brand-logo{width:140px} }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">
        <img src="stawa_logo_transparent.png" alt="STAWA Logo" loading="eager">
      </div>
    </div>

    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="products.html" class="active">Ürünler</a>
      <a href="index.html#about">Hakkımızda</a>
      <a href="index.html#contact">İletişim</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="kicker"><span class="kdot"></span> STAWA · Koleksiyon</div>
  <h1>Ürünler</h1>
  <p class="lead">Aşağıdaki ürünler güncel stok durumuyla listelenir.</p>

  <section class="card">
    <div class="card-head">
      <h2>Ürün Listesi</h2>
      <span id="countInfo">0 ürün</span>
    </div>
    <div class="products" id="products"></div>
  </section>
</main>

<footer>© STAWA — Products</footer>

<script>
  const KEY = "stawa_products_v1";
  const $ = (s, r=document) => r.querySelector(s);

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[s]));
  }

  function loadProducts(){
    try{
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : [];
    }catch{ return []; }
  }

  function render(){
    const list = loadProducts();
    const wrap = $("#products");
    const countInfo = $("#countInfo");
    if(!wrap) return;

    countInfo.textContent = `${list.length} ürün`;
    wrap.innerHTML = "";

    if(list.length === 0){
      wrap.innerHTML = `<div class="empty">Henüz ürün eklenmedi.</div>`;
      return;
    }

    list.forEach(item => {
      const stockClass = item.stock === "in" ? "in" : "out";
      const stockText  = item.stock === "in" ? "STOK VAR" : "STOK YOK";

      const el = document.createElement("div");
      el.className = "pitem";
      el.innerHTML = `
        <p class="ptitle">${escapeHtml(item.name)} <span style="color:#6a6d7b;font-weight:600;">${item.code ? "· " + escapeHtml(item.code) : ""}</span></p>
        <div class="pmeta">
          ${item.price ? ("<div><b>Fiyat:</b> " + escapeHtml(item.price) + "</div>") : ""}
          ${item.desc ? ("<div>" + escapeHtml(item.desc) + "</div>") : ""}
        </div>
        <div class="pill ${stockClass}">
          <i class="fa-solid fa-box" aria-hidden="true"></i>
          <b>${stockText}</b>
        </div>
      `;
      wrap.appendChild(el);
    });
  }

  render();
  window.addEventListener("storage", (e) => { if(e.key === KEY) render(); });
</script>
</body>
</html>
