<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>STAWA — Products</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    :root{
      --ink:#111317;
      --muted:#6a6d7b;
      --muted2:#8e92a3;
      --gold:#f0b868;
      --gold-soft: rgba(240,184,104,0.18);

      --line: rgba(17,19,23,0.08);
      --radius-lg: 26px;
      --radius-md: 18px;
      --radius-pill: 999px;

      --shadow: 0 26px 70px rgba(15,16,35,0.12);
      --shadow-soft: 0 14px 42px rgba(15,16,35,0.10);

      --t: 0.18s ease-out;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--ink);
      background: radial-gradient(circle at top, #ffffff 0%, #fbfbff 45%, #f7f8fc 100%);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background-image:
        repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 6px),
        url("damask-transparent.png");
      background-size: 6px 6px, 203px 256px;
      background-repeat: repeat;
      opacity: 0.14;
      mix-blend-mode: multiply;
      z-index:-2;
    }

    header{
      position:sticky; top:0; z-index:20;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner{
      max-width:1180px; margin:0 auto;
      padding:12px 22px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{display:flex; align-items:center; gap:12px; min-width: 220px;}
    .brand-logo{width:150px; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.10));}
    .brand-logo img{width:100%; height:auto; display:block;}
    .brand-sub{
      font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
      color: var(--muted2); white-space: nowrap;
    }

    nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
    nav a{
      text-decoration:none;
      color: rgba(17,19,23,0.82);
      font-size:14px; font-weight:500;
      padding:7px 14px;
      border-radius: var(--radius-pill);
      border:1px solid rgba(17,19,23,0.10);
      background: rgba(255,255,255,0.78);
      transition: var(--t);
    }
    nav a:hover{border-color: rgba(17,19,23,0.24); box-shadow: var(--shadow-soft); transform: translateY(-1px);}
    nav a.active{
      border-color: rgba(240,184,104,0.65);
      background: linear-gradient(135deg, rgba(240,184,104,0.18), rgba(255,255,255,0.85));
    }

    /* Language (flag + code) */
    .lang-switch{ position:relative; margin-left:8px; }
    .lang-toggle{
      border-radius:999px;
      border:1px solid rgba(17,19,23,0.14);
      background: rgba(255,255,255,0.82);
      color: rgba(17,19,23,0.80);
      padding:6px 12px;
      cursor:pointer;
      transition: var(--t);
      display:flex; align-items:center; gap:8px;
      user-select:none;
      font-weight:500;
    }
    .lang-toggle::after{content:"▾"; font-size:10px; opacity:0.8}
    .lang-toggle:hover{border-color: rgba(17,19,23,0.30); box-shadow: var(--shadow-soft); transform: translateY(-1px);}

    .lang-menu{
      position:absolute; top:110%; right:0;
      min-width:140px;
      padding:6px;
      border-radius:16px;
      background: rgba(255,255,255,0.95);
      border:1px solid rgba(17,19,23,0.14);
      box-shadow: 0 14px 40px rgba(0,0,0,0.10);
      opacity:0; pointer-events:none;
      transform: translateY(4px);
      transition: opacity 0.18s ease-out, transform 0.18s ease-out;
      z-index:30;
    }
    .lang-menu.open{opacity:1; pointer-events:auto; transform: translateY(0)}
    .lang-btn{
      width:100%;
      border:none;
      background: transparent;
      color: rgba(17,19,23,0.80);
      font-size:12px;
      padding:8px 10px;
      text-align:left;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:0.14em;
      border-radius:12px;
      display:flex; align-items:center; gap:10px;
      transition: background 0.16s ease-out, color 0.16s ease-out;
    }
    .lang-btn.active{ background:#111317; color:#fff; }
    .lang-btn:hover{ background: rgba(17,19,23,0.06); }
    .flag{ font-size:15px; line-height:1; opacity:0.92; }
    .lang-code{ font-size:12px; letter-spacing:0.10em; }

    .container{max-width:1180px; margin:0 auto; padding:26px 22px 52px;}

    .top{display:flex; flex-direction:column; gap:10px; padding:10px 0 14px;}
    .kicker{
      display:inline-flex; align-items:center; gap:10px;
      font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color: var(--muted2);
    }
    .kdot{width:7px; height:7px; border-radius:999px; background: var(--gold); box-shadow: 0 0 0 6px var(--gold-soft);}
    h1{margin:0; font-size: clamp(26px, 3.2vw, 34px); line-height: 1.15;}
    .lead{margin:0; color: var(--muted); line-height: 1.85; max-width: 760px; font-size: 14px;}

    .panel{
      margin-top: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(17,19,23,0.08);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      padding:16px 18px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      border-bottom: 1px solid rgba(17,19,23,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.78));
    }
    .panel-head h2{
      margin:0;
      font-size: 13px;
      letter-spacing:0.18em;
      text-transform: uppercase;
      color: rgba(17,19,23,0.88);
    }
    .count{
      font-size: 12px;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(17,19,23,0.10);
      background: rgba(255,255,255,0.85);
      user-select:none;
      white-space:nowrap;
    }

    .list{
      padding: 14px 14px 16px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .item{
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(17,19,23,0.08);
      box-shadow: 0 10px 26px rgba(15,16,35,0.08);
      padding: 14px 14px 12px;
      transition: var(--t);
    }
    .item:hover{transform: translateY(-2px); box-shadow: 0 18px 42px rgba(15,16,35,0.12); border-color: rgba(240,184,104,0.45);}
    .name{margin:0; font-weight: 600; font-size: 14px; color: rgba(17,19,23,0.92);}
    .code{margin-top: 6px; font-size: 12px; color: var(--muted2); letter-spacing: 0.10em; text-transform: uppercase;}
    .meta{margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.65;}

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(17,19,23,0.10);
      background: rgba(255,255,255,0.92);
      font-size: 11px;
      user-select:none;
      width:max-content;
    }
    .pill.in{border-color: rgba(50,217,81,0.30); background: rgba(50,217,81,0.08);}
    .pill.out{border-color: rgba(220,60,60,0.30); background: rgba(220,60,60,0.08);}
    .pill b{letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; font-size: 10px;}

    .empty{padding: 18px; color: var(--muted); font-size: 14px;}

    footer{padding: 18px 0 30px; text-align:center; color: var(--muted2); font-size: 13px;}

    html[dir="rtl"] body { text-align:right; }
    html[dir="rtl"] nav { flex-direction: row-reverse; }
    html[dir="rtl"] .lang-menu { right:auto; left:0; }

    @media (max-width: 980px){
      .list{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .brand-sub{ display:none; }
    }
    @media (max-width: 640px){
      .header-inner{ padding:10px 14px; flex-direction:column; align-items:flex-start; gap:10px; }
      .brand{ width:100%; }
      nav{ width:100%; }
      .list{ grid-template-columns: 1fr; }
      .brand-logo{ width:140px; }
      .lang-switch{ margin-left:auto; }
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">
        <img src="stawa_logo_transparent.png" alt="STAWA Logo" loading="eager">
      </div>
      <div class="brand-sub" data-i18n="brand_sub">Premium kumaş & zamansız tasarım</div>
    </div>

    <nav>
      <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
      <a href="products.html" class="active" data-i18n="nav_products">Ürünler</a>
      <a href="index.html#about" data-i18n="nav_about">Hakkımızda</a>
      <a href="index.html#contact" data-i18n="nav_contact">İletişim</a>

      <div class="lang-switch">
        <button type="button" class="lang-toggle" id="langToggle">
          <span class="flag" id="langFlag">🇹🇷</span>
          <span class="lang-code" id="langCode">TR</span>
        </button>

        <div class="lang-menu" id="langMenu">
          <button type="button" class="lang-btn active" data-lang="tr"><span class="flag">🇹🇷</span><span>TR</span></button>
          <button type="button" class="lang-btn" data-lang="en"><span class="flag">🇬🇧</span><span>EN</span></button>
          <button type="button" class="lang-btn" data-lang="ru"><span class="flag">🇷🇺</span><span>RU</span></button>
          <button type="button" class="lang-btn" data-lang="ar"><span class="flag">🇸🇦</span><span>AR</span></button>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="container">
  <section class="top">
    <div class="kicker"><span class="kdot"></span> <span data-i18n="kicker_products">Koleksiyon</span></div>
    <h1 data-i18n="products_title">Ürünler</h1>
    <p class="lead" data-i18n="products_lead">
      Güncel stok durumu ile listelenen ürünler. Toptan alım için WhatsApp veya e-posta üzerinden iletişime geçebilirsiniz.
    </p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="products_list_title">Ürün Listesi</h2>
      <div class="count" id="countInfo">0</div>
    </div>

    <div class="list" id="products"></div>
    <div class="empty" id="emptyState" style="display:none;" data-i18n="products_empty">Henüz ürün eklenmedi.</div>
  </section>
</main>

<footer>
  <span data-i18n="footer_text">© STAWA — 2012 - Günümüz · İstanbul Laleli</span>
</footer>

<script>
  const i18n = {
    tr: {
      brand_sub: "Premium kumaş & zamansız tasarım",
      nav_home: "Ana Sayfa", nav_products: "Ürünler", nav_about: "Hakkımızda", nav_contact: "İletişim",
      kicker_products: "Koleksiyon",
      products_title: "Ürünler",
      products_lead: "Güncel stok durumu ile listelenen ürünler. Toptan alım için WhatsApp veya e-posta üzerinden iletişime geçebilirsiniz.",
      products_list_title: "Ürün Listesi",
      products_empty: "Henüz ürün eklenmedi.",
      footer_text: "© STAWA — 2012 - Günümüz · İstanbul Laleli",
      stock_in: "Stok Var",
      stock_out: "Stok Yok",
      count_products: "ürün",
      price_label: "Fiyat"
    },
    en: {
      brand_sub: "Premium fabric & timeless design",
      nav_home: "Home", nav_products: "Products", nav_about: "About", nav_contact: "Contact",
      kicker_products: "Collection",
      products_title: "Products",
      products_lead: "Products listed with current stock status. For wholesale orders, contact us via WhatsApp or e-mail.",
      products_list_title: "Product List",
      products_empty: "No products yet.",
      footer_text: "© STAWA — 2012 - Present · Istanbul Laleli",
      stock_in: "In Stock",
      stock_out: "Out of Stock",
      count_products: "products",
      price_label: "Price"
    },
    ru: {
      brand_sub: "Премиальные ткани и дизайн вне времени",
      nav_home: "Главная", nav_products: "Товары", nav_about: "О нас", nav_contact: "Контакты",
      kicker_products: "Коллекция",
      products_title: "Товары",
      products_lead: "Товары с актуальным статусом наличия. Для опта свяжитесь через WhatsApp или e-mail.",
      products_list_title: "Список товаров",
      products_empty: "Пока нет товаров.",
      footer_text: "© STAWA — 2012 - наст. время · Стамбул, Лалели",
      stock_in: "В наличии",
      stock_out: "Нет в наличии",
      count_products: "товаров",
      price_label: "Цена"
    },
    ar: {
      brand_sub: "أقمشة فاخرة وتصميم خالد",
      nav_home: "الرئيسية", nav_products: "المنتجات", nav_about: "من نحن", nav_contact: "اتصال",
      kicker_products: "المجموعة",
      products_title: "المنتجات",
      products_lead: "المنتجات مع حالة المخزون الحالية. للطلبات بالجملة تواصل عبر واتساب أو البريد.",
      products_list_title: "قائمة المنتجات",
      products_empty: "لا توجد منتجات بعد.",
      footer_text: "© STAWA — 2012 - حتى الآن · إسطنبول لاليلي",
      stock_in: "متوفر",
      stock_out: "غير متوفر",
      count_products: "منتج",
      price_label: "السعر"
    }
  };

  const KEY = "stawa_products_v1";

  const storage = {
    get(key, fallback=null) { try { const v = localStorage.getItem(key); return v===null ? fallback : v; } catch { return fallback; } },
    set(key, val) { try { localStorage.setItem(key, String(val)); } catch {} }
  };

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function getFlag(lang){
    return ({ tr:"🇹🇷", en:"🇬🇧", ru:"🇷🇺", ar:"🇸🇦" }[lang] || "🇹🇷");
  }

  function setLanguage(lang){
    const dict = i18n[lang] || i18n.tr;

    $$("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key]) el.textContent = dict[key];
    });

    $$(".lang-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    $("#langCode").textContent = lang.toUpperCase();
    $("#langFlag").textContent = getFlag(lang);

    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";

    storage.set("stawa_lang", lang);

    renderProducts();
  }

  function initLanguageMenu(){
    const langMenu = $("#langMenu");
    const langToggle = $("#langToggle");

    if (langToggle && langMenu){
      langToggle.addEventListener("click", (e) => { e.stopPropagation(); langMenu.classList.toggle("open"); });
      document.addEventListener("click", () => langMenu.classList.remove("open"));
      langMenu.addEventListener("click", (e) => e.stopPropagation());
    }

    $$(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.getAttribute("data-lang");
        setLanguage(lang);
        langMenu?.classList.remove("open");
      });
    });

    setLanguage(storage.get("stawa_lang", "tr"));
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[s]));
  }

  function loadProducts(){
    try{
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : [];
    }catch{ return []; }
  }

  function renderProducts(){
    const lang = storage.get("stawa_lang", "tr");
    const dict = i18n[lang] || i18n.tr;

    const list = loadProducts();
    const wrap = $("#products");
    const empty = $("#emptyState");
    const count = $("#countInfo");

    count.textContent = `${list.length} ${dict.count_products}`;
    wrap.innerHTML = "";

    if(list.length === 0){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.forEach(item => {
      const stockLabel = item.stock === "in" ? dict.stock_in : dict.stock_out;
      const stockClass = item.stock === "in" ? "in" : "out";

      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <p class="name">${escapeHtml(item.name || "")}</p>
        ${item.code ? `<div class="code">${escapeHtml(item.code)}</div>` : ``}

        <div class="meta">
          ${item.price ? `<div><b>${escapeHtml(dict.price_label)}:</b> ${escapeHtml(item.price)}</div>` : ``}
          ${item.desc ? `<div>${escapeHtml(item.desc)}</div>` : ``}
        </div>

        <div class="pill ${stockClass}">
          <i class="fa-solid fa-box" aria-hidden="true"></i>
          <b>${escapeHtml(stockLabel)}</b>
        </div>
      `;
      wrap.appendChild(el);
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    initLanguageMenu();
    renderProducts();
  });

  window.addEventListener("storage", (e) => {
    if (e.key === KEY) renderProducts();
  });
</script>
</body>
</html>
